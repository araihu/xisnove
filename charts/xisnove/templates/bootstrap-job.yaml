{{- if and .Values.bootstrap.enabled (ne .Values.database.profile "sqlite") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "xisnove.fullname" . }}-bootstrap
  labels:
    {{- include "xisnove.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.bootstrap.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "xisnove.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap
          image: {{ include "xisnove.serverImage" . }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          args:
            - admin
            - bootstrap
            {{- include "xisnove.databaseArgs" . | nindent 12 }}
            - --email
            - {{ .Values.secrets.admin.email | quote }}
            - --password-file
            - /var/run/secrets/xisnove/admin/password
            - --timeout
            - {{ .Values.bootstrap.timeout | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            {{- include "xisnove.databaseVolumeMount" . | nindent 12 }}
            - name: admin-secret
              mountPath: /var/run/secrets/xisnove/admin
              readOnly: true
      volumes:
        {{- include "xisnove.databaseSecretVolume" . | nindent 8 }}
        - name: admin-secret
          secret:
            secretName: {{ required "secrets.admin.existingSecret.name is required" .Values.secrets.admin.existingSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.secrets.admin.existingSecret.passwordKey }}
                path: password
{{- end }}
