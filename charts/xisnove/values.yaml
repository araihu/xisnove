nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

database:
  # sqlite, postgres, or tursoManaged. Local Turso is raw/Compose-only in v1.
  profile: sqlite
  installationID: default
  migration:
    activeDeadlineSeconds: 300
    backoffLimit: 2
    ttlSecondsAfterFinished: 600
    lockTimeout: 30s
    timeout: 240s
  sqlite:
    size: 5Gi
    storageClassName: ""
  postgres:
    existingSecret:
      name: ""
      urlKey: url
  tursoManaged:
    existingSecret:
      name: ""
      urlKey: url
      authTokenKey: auth-token

secrets:
  server:
    existingSecret:
      name: xisnove-server
      cursorSigningKeyKey: cursor-signing-key
      notificationMasterKeyKey: notification-master-key
  admin:
    email: admin@example.com
    existingSecret:
      name: xisnove-admin
      passwordKey: password
  ui:
    existingSecret:
      name: xisnove-ui
      cookieSecretKey: cookie-secret

server:
  replicas: 1
  image:
    repository: ghcr.io/araihu/xisnove-server
    tag: ""
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

ui:
  replicas: 2
  image:
    repository: ghcr.io/araihu/xisnove-ui
    tag: ""
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
  service:
    type: ClusterIP
    port: 8081
  cookieSecure: true
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

bootstrap:
  enabled: true
  activeDeadlineSeconds: 300
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  timeout: 240s

agent:
  enabled: false
  replicas: 1
  name: colocated-public
  image:
    repository: ghcr.io/araihu/xisnove-agent
    tag: ""
    pullPolicy: IfNotPresent
  existingSecret:
    name: xisnove-agent
    credentialKey: credential
  enrollment:
    enabled: false
    timeout: 30s
    existingSecret:
      name: ""
      tokenKey: token
    storage:
      size: 64Mi
      storageClassName: ""
  serviceAccount:
    create: true
    name: ""
  capabilities: [http, tcp, dns]
  allowedPrivateCIDRs: []
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls:
    enabled: false
    existingSecretName: ""

gateway:
  enabled: false
  parentRef:
    name: ""
    namespace: ""
    sectionName: ""
  hostnames: []

networkPolicy:
  enabled: false
  ingressNamespaceSelector: {}

pdb:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
