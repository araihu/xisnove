name: homelab release acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Release workflow run containing the candidate artifact
        required: true
        type: string
      candidate_commit:
        description: Exact accepted 40-character commit
        required: true
        type: string
      candidate_version:
        description: Accepted release version without the v prefix
        required: true
        type: string
      candidate_artifact_digest:
        description: Exact sha256 digest emitted by actions/upload-artifact
        required: true
        type: string
  workflow_call:
    inputs:
      candidate_run_id:
        required: true
        type: string
      candidate_commit:
        required: true
        type: string
      candidate_version:
        required: true
        type: string
      candidate_artifact_digest:
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  GH_VERSION: 2.96.0
  GH_SHA256: 83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60
  ORAS_VERSION: 1.3.2
  ORAS_SHA256: 9229ccc6d17bb282039ad4a69abb16dcb887a5bce567c075d731d9b3c7ad8eaf

concurrency:
  group: homelab-release-acceptance-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  homelab-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: xisnove-homelab
    steps:
      - name: Reject ambiguous candidate identity
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified GitHub CLI and ORAS
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GH_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" "$RUNNER_TEMP/xisnove-gh"

          oras_archive="$RUNNER_TEMP/oras.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$oras_archive" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ORAS_SHA256" "$oras_archive" | sha256sum --check
          tar -xzf "$oras_archive" -C "$RUNNER_TEMP" oras
          install -m 0755 "$RUNNER_TEMP/oras" "$RUNNER_TEMP/xisnove-oras"
      - name: Verify service-side candidate digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DIGEST: ${{ inputs.candidate_artifact_digest }}
        run: |
          set -euo pipefail
          actual="$($RUNNER_TEMP/xisnove-gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.candidate_run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "xisnove-release-candidate") | .digest')"
          test "$actual" = "$EXPECTED_DIGEST"
      - name: Download exact candidate from named release run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xisnove-release-candidate
          path: dist/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify candidate closure, commit, and version
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          RELEASEBUNDLE_BIN=dist/candidate/tools/releasebundle \
            scripts/release/verify-bundle.sh \
            --root dist/candidate \
            --manifest candidate-manifest.json \
            --checksum candidate-manifest.json.sha256
          jq -e \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg version "$CANDIDATE_VERSION" \
            '.repository == "github.com/araihu/xisnove" and .commit == $commit and .version == $version' \
            dist/candidate/candidate-manifest.json >/dev/null
      - name: Execute accepted linux amd64 binaries
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/xisnove-candidate-binaries"
          mkdir -p "$smoke"
          for binary in xisnove-server xisnove-ui xisnove-agent xisnove-operator xisnove; do
            archive="$(jq -er --arg prefix "archives/${binary}_${CANDIDATE_VERSION}_linux_amd64.tar.gz" '
              .subjects[] | select(.kind == "archive" and .locator == $prefix) | .locator
            ' dist/candidate/candidate-manifest.json)"
            directory="$smoke/$binary"
            mkdir -p "$directory"
            while IFS= read -r entry; do
              case "$entry" in
                ""|/*|../*|*/../*) echo "unsafe archive entry: $entry" >&2; exit 1 ;;
              esac
            done < <(tar -tzf "dist/candidate/$archive")
            tar -xzf "dist/candidate/$archive" -C "$directory"
            executable="$(find "$directory" -type f -name "$binary" -perm -111 -print -quit)"
            test -n "$executable"
            version_output="$($executable --version)"
            grep -F "$CANDIDATE_VERSION" <<<"$version_output" >/dev/null
            grep -F "$CANDIDATE_COMMIT" <<<"$version_output" >/dev/null
          done
      - name: Run cluster acceptance against accepted candidate OCI bytes
        shell: bash
        env:
          ORAS_BIN: ${{ runner.temp }}/xisnove-oras
          XISNOVE_RELEASE_CANDIDATE_ROOT: ${{ github.workspace }}/dist/candidate
          XISNOVE_RELEASE_COMMIT: ${{ inputs.candidate_commit }}
          XISNOVE_RELEASE_VERSION: ${{ inputs.candidate_version }}
        run: >-
          bash scripts/release/accept-candidate-homelab.sh
          --candidate-root "$XISNOVE_RELEASE_CANDIDATE_ROOT"
          --commit "$XISNOVE_RELEASE_COMMIT"
          --version "$XISNOVE_RELEASE_VERSION"
      - name: Clean acceptance workspace and assert no residue
        if: always()
        shell: bash
        run: |
          rm -rf dist/candidate .artifacts "$RUNNER_TEMP/xisnove-gh" "$RUNNER_TEMP/xisnove-oras" \
            "$RUNNER_TEMP/gh.tar.gz" "$RUNNER_TEMP/oras.tar.gz" "$RUNNER_TEMP/oras" \
            "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64" "$RUNNER_TEMP/xisnove-candidate-binaries"
          test ! -e dist/candidate
          test ! -e .artifacts
          test ! -e "$RUNNER_TEMP/xisnove-gh"
