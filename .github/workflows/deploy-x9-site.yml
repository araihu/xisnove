name: Deploy X-9 site

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-x9-site.yml"
      - ".dagger/**"
      - "dagger.json"
      - "scripts/materialize-dagger-input.sh"
      - "scripts/check-dagger-runner-contract.sh"
      - "site/**"
  push:
    branches:
      - "codex/milestone-2b-persistence"
    paths:
      - ".github/workflows/deploy-x9-site.yml"
      - ".dagger/**"
      - "dagger.json"
      - "scripts/materialize-dagger-input.sh"
      - "scripts/check-dagger-runner-contract.sh"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x9-site-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static site
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/main' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-24.04'
      }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Materialize site Dagger input
        shell: bash
        env:
          DAGGER_EVENT_NAME: ${{ github.event_name }}
          DAGGER_REF: ${{ github.ref }}
          DAGGER_RUN_ID: ${{ github.run_id }}
          DAGGER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash scripts/materialize-dagger-input.sh site .dagger-inputs/site.json

      - name: Install exact Dagger CLI on GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.8"

      - name: Require exact Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 { print $2 }')" = v0.21.8

      - name: Validate static site through Dagger
        shell: bash
        run: dagger call site-validate --source=. --input=.dagger-inputs/site.json export --path=x9-site-output

      - name: Upload validated site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: x9-site-public
          path: x9-site-output
          if-no-files-found: error

  deploy:
    name: Deploy Cloudflare Worker
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: validate
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/main' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-24.04'
      }}
    environment:
      name: production
      url: https://x9.araihu.com
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: x9-site-public
          path: site/public

      - name: Materialize deploy Dagger input
        shell: bash
        env:
          DAGGER_EVENT_NAME: ${{ github.event_name }}
          DAGGER_REF: ${{ github.ref }}
          DAGGER_RUN_ID: ${{ github.run_id }}
          DAGGER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/materialize-dagger-input.sh deploy .dagger-inputs/deploy.json

      - name: Install exact Dagger CLI on GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.8"

      - name: Require exact Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 { print $2 }')" = v0.21.8

      - name: Deploy validated site through Dagger
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          dagger call site-deploy --source=. --artifact=site/public
          --input=.dagger-inputs/deploy.json
          --cloudflare-api-token=env:CLOUDFLARE_API_TOKEN
