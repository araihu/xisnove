name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  root:
    runs-on: ubuntu-24.04
    env:
      XISNOVE_TEST_POSTGRES_URL: postgres://postgres:xisnove@127.0.0.1:5432/xisnove?sslmode=disable
    services:
      postgres:
        image: postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
        env:
          POSTGRES_DB: xisnove
          POSTGRES_PASSWORD: xisnove
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xisnove"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.sum
            agent/go.sum
            cli/go.sum
            operator/go.sum
            ui/go.sum
      - name: Verify generated artifacts and API contracts
        run: make generated-check
      - name: Verify external-module isolation
        run: make module-check
      - name: Verify release workspace and distribution contracts
        run: make distribution-contract-check
      - name: Verify SQLite, local Turso, and PostgreSQL operations journeys
        run: make storage-check
      - name: Verify notification faults, recovery, retention, observability, and lifecycle
        run: make operations-check
      - name: Run root race suite
        run: make race-check
      - name: PostgreSQL backup and restore smoke
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: xisnove
          POSTGRES_DATABASE: xisnove
          POSTGRES_RESTORE_DATABASE: xisnove_restore_smoke
          XISNOVE_TEST_POSTGRES_RESTORE_URL: postgres://postgres:xisnove@127.0.0.1:5432/xisnove_restore_smoke?sslmode=disable
        run: bash scripts/postgres-backup-smoke.sh
      - name: Check OpenAPI compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git show "origin/${BASE_REF}:api/openapi.yaml" > /tmp/base-openapi.yaml 2>/dev/null; then
            go tool oasdiff breaking /tmp/base-openapi.yaml api/openapi.yaml
          else
            echo "No API compatibility baseline exists."
          fi

  agent:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: agent/go.sum
      - run: GOWORK=off go generate ./...
      - run: git diff --exit-code
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off go test -race ./...

  agent-workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.sum
            agent/go.sum
      - run: go test -race ./agent/...

  operator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.sum
            operator/go.sum
      - name: Verify generated operator artifacts
        run: make -C operator verify
      - name: Run operator envtest journeys with pinned assets
        run: make -C operator envtest
      - name: Run standalone operator race suite
        run: GOWORK=off go -C operator test -race ./...
      - name: Vet standalone operator module
        run: GOWORK=off go -C operator vet ./...
      - name: Compile and test operator against the repository-local SDK
        run: go test -race ./operator/...

  kubernetes-edge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.sum
            agent/go.sum
            operator/go.sum
      - name: Install pinned kind and Helm clients
        run: |
          set -euo pipefail
          lock=build/release/toolchain.lock.json
          tool_dir="$(mktemp -d)"
          trap 'rm -rf "$tool_dir"' EXIT

          kind_version="$(jq -er '.tools[] | select(.name == "kind") | .version' "$lock")"
          kind_checksum="$(jq -er '.tools[] | select(.name == "kind") | .checksums["linux-amd64"]' "$lock")"
          curl --fail --location --silent --show-error \
            --output "$tool_dir/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/v${kind_version}/kind-linux-amd64"
          printf '%s  %s\n' "$kind_checksum" "$tool_dir/kind" | sha256sum --check
          install -m 0755 "$tool_dir/kind" "$(go env GOPATH)/bin/kind"

          helm_version="$(jq -er '.tools[] | select(.name == "helm") | .version' "$lock")"
          helm_checksum="$(jq -er '.tools[] | select(.name == "helm") | .checksums["linux-amd64"]' "$lock")"
          helm_archive="$tool_dir/helm.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$helm_archive" \
            "https://get.helm.sh/helm-v${helm_version}-linux-amd64.tar.gz"
          printf '%s  %s\n' "$helm_checksum" "$helm_archive" | sha256sum --check
          tar -xzf "$helm_archive" -C "$tool_dir"
          install -m 0755 "$tool_dir/linux-amd64/helm" "$(go env GOPATH)/bin/helm"
      - name: Install checksum-verified kubectl
        run: |
          set -euo pipefail
          lock=build/release/toolchain.lock.json
          tool_dir="$(mktemp -d)"
          trap 'rm -rf "$tool_dir"' EXIT
          kubectl_version="$(jq -er '.tools[] | select(.name == "kubectl") | .version' "$lock")"
          kubectl_checksum="$(jq -er '.tools[] | select(.name == "kubectl") | .checksums["linux-amd64"]' "$lock")"
          curl --fail --location --silent --show-error \
            --output "$tool_dir/kubectl" \
            "https://dl.k8s.io/release/v${kubectl_version}/bin/linux/amd64/kubectl"
          printf '%s  %s\n' "$kubectl_checksum" "$tool_dir/kubectl" | sha256sum --check
          install -m 0755 "$tool_dir/kubectl" "$(go env GOPATH)/bin/kubectl"
      - name: Run external-control-plane Kubernetes edge journey
        run: make kind-edge-e2e

  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: cli/go.sum
      - name: Verify standalone CLI module against the published SDK and mock
        run: make cli-check

  cli-workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.sum
            cli/go.sum
      - name: Verify CLI against the repository-local generated SDK
        run: make cli-workspace-check

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: ui/go.sum
      - name: Verify standalone UI module and generated templ
        run: make ui-check
      - name: Compile and test UI against the repository-local SDK
        run: go test -race ./ui/...
      - name: Run frozen mock browser smoke
        run: make ui-browser-smoke
