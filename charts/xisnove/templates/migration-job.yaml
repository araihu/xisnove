{{- if ne .Values.database.profile "sqlite" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "xisnove.fullname" . }}-migrate
  labels:
    {{- include "xisnove.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.database.migration.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.database.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.database.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "xisnove.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "xisnove.serverImage" . }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          args:
            - db
            - migrate
            {{- include "xisnove.databaseArgs" . | nindent 12 }}
            - --phase
            - expand
            - --lock-timeout
            - {{ .Values.database.migration.lockTimeout | quote }}
            - --timeout
            - {{ .Values.database.migration.timeout | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            {{- include "xisnove.databaseVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "xisnove.databaseSecretVolume" . | nindent 8 }}
{{- end }}
