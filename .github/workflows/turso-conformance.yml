name: libSQL and optional managed Turso conformance

on:
  workflow_dispatch:
    inputs:
      managed:
        description: Also test the real Turso Cloud provisioning API (requires credentials)
        type: boolean
        default: false
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: managed-turso-conformance
  cancel-in-progress: false

env:
  _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-image://registry.dagger.io/engine:v0.21.11@sha256:6b557cc8b5fdfee0e2e8c82d451ac922097a1255482143e1b96c0be3ff2a303c

jobs:
  libsql:
    name: Disposable libSQL conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Materialize libSQL Dagger input
        shell: bash
        env:
          DAGGER_EVENT_NAME: ${{ github.event_name }}
          DAGGER_REF: ${{ github.ref }}
          DAGGER_RUN_ID: ${{ github.run_id }}
          DAGGER_RUN_ATTEMPT: ${{ github.run_attempt }}
          DAGGER_HAS_BASELINE: 'false'
        run: bash scripts/materialize-dagger-input.sh ci .dagger-inputs/libsql.json
      - name: Install exact Dagger CLI
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: '0.21.11'
      - name: Require exact Dagger CLI
        run: test "$(dagger version | awk 'NR == 1 { print $2 }')" = v0.21.11
      - name: Test remote adapter and full storage journey on disposable libSQL
        run: dagger call libsql-conformance --source=. --input=.dagger-inputs/libsql.json

  conformance:
    name: Managed Turso Cloud (opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.managed }}
    runs-on: >-
      ${{
        github.event_name == 'release' &&
        startsWith(github.ref, 'refs/tags/') &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-latest'
      }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require managed Turso configuration
        shell: bash
        env:
          TURSO_GROUP: ${{ vars.TURSO_GROUP }}
          TURSO_API_KEY: ${{ secrets.TURSO_API_KEY }}
        run: |
          set -euo pipefail
          missing=false
          if [[ -z "$TURSO_GROUP" ]]; then
            echo '::error::Configure repository variable TURSO_GROUP with a dedicated CI group.'
            missing=true
          fi
          if [[ -z "$TURSO_API_KEY" ]]; then
            echo '::error::Configure repository secret TURSO_API_KEY with the test organization API token.'
            missing=true
          fi
          test "$missing" = false

      - name: Materialize managed Turso Dagger input
        shell: bash
        env:
          DAGGER_EVENT_NAME: ${{ github.event_name }}
          DAGGER_REF: ${{ github.ref }}
          DAGGER_RUN_ID: ${{ github.run_id }}
          DAGGER_RUN_ATTEMPT: ${{ github.run_attempt }}
          TURSO_ORG: ${{ vars.TURSO_ORG }}
          TURSO_GROUP: ${{ vars.TURSO_GROUP }}
        run: bash scripts/materialize-dagger-input.sh turso .dagger-inputs/turso.json

      - name: Install exact Dagger CLI
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.11"

      - name: Require exact Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 { print $2 }')" = v0.21.11

      - name: Run managed Turso conformance through Dagger
        id: conformance
        shell: bash
        env:
          TURSO_API_KEY: ${{ secrets.TURSO_API_KEY }}
        run: >-
          dagger call turso-conformance --source=. --input=.dagger-inputs/turso.json
          --turso-api-key=env:TURSO_API_KEY export --path=turso-output

      - name: Upload managed Turso test report
        if: ${{ !cancelled() && steps.conformance.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: managed-turso-storage-matrix
          path: turso-output/managed-turso-storage-matrix.xml
          if-no-files-found: error

      - name: Propagate managed Turso test status
        if: ${{ !cancelled() && steps.conformance.outcome == 'success' }}
        shell: bash
        run: test "$(cat turso-output/status)" = 0
