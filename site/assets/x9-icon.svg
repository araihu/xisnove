<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc" class="araihu-brand-v11">
  <title id="title">X-9 v11 icon</title>
  <desc id="desc">Adaptive X-9 icon on a transparent surface; colors respond to light and dark themes.</desc>
  <style>.v11-surface {
  fill: var(--araihu-logo-surface, var(--araihu-logo-auto-surface, #f3f2e9));
}
.v11-ink {
  fill: var(--araihu-logo-ink, var(--araihu-logo-auto-ink, #07111f));
}
.v11-signal {
  fill: var(--araihu-logo-signal, var(--araihu-logo-auto-signal, #c7ff4a));
}
@media (prefers-color-scheme: dark) {
  :root {
    --araihu-logo-auto-surface: #07111f;
    --araihu-logo-auto-ink: #f3f2e9;
    --araihu-logo-auto-signal: #c7ff4a;
  }
}</style>
