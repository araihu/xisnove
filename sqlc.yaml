version: "2"
sql:
  - engine: sqlite
    schema: db/migrations/sqlite
    queries: db/queries/sqlite
    gen:
      go:
        package: dbsqlite
        out: db/generated/sqlite
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
  - engine: postgresql
    schema: db/migrations/postgres
    queries: db/queries/postgres
    gen:
      go:
        package: dbpostgres
        out: db/generated/postgres
        sql_package: database/sql
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              import: database/sql
              type: NullString
