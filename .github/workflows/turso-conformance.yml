name: managed Turso conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
  release:
    types: [published, prereleased]

permissions:
  contents: read

concurrency:
  group: managed-turso-conformance
  cancel-in-progress: false

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.1"
          cache-dependency-path: go.sum
      - name: Install pinned test reporter
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: Run managed Turso repository conformance
        env:
          TURSO_API_KEY: ${{ secrets.TURSO_API_KEY }}
          TURSO_ORG: ${{ vars.TURSO_ORG }}
          TURSO_GROUP: ${{ vars.TURSO_GROUP }}
        run: go test -race ./internal/adapters/tursocloud -run Conformance -count=1
      - name: Run managed Turso storage journey
        env:
          TURSO_API_KEY: ${{ secrets.TURSO_API_KEY }}
          TURSO_ORG: ${{ vars.TURSO_ORG }}
          TURSO_GROUP: ${{ vars.TURSO_GROUP }}
        run: >-
          gotestsum --junitfile managed-turso-storage-matrix.xml --
          -race ./integration -run '^TestStorageMatrix/TursoCloud$' -count=1
      - name: Upload managed Turso test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-turso-storage-matrix
          path: managed-turso-storage-matrix.xml
          if-no-files-found: error
