apiVersion: v1
kind: Service
metadata:
  name: catalog-target
  namespace: xisnove-edge-e2e
spec:
  selector:
    app: catalog-target
  ports:
    - name: http
      appProtocol: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog-target
  namespace: xisnove-edge-e2e
  labels:
    xisnove.dev/exposure: tailscale
spec:
  rules:
    - host: catalog-target.example.test
      http:
        paths:
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: catalog-target
                port:
                  number: 8080
