name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  root:
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-latest'
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Materialize root Dagger input
        shell: bash
        env:
          DAGGER_EVENT_NAME: ${{ github.event_name }}
          DAGGER_REF: ${{ github.ref }}
          DAGGER_RUN_ID: ${{ github.run_id }}
          DAGGER_RUN_ATTEMPT: ${{ github.run_attempt }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -e .dagger-inputs || -L .dagger-inputs ]]; then
            [[ -d .dagger-inputs && ! -L .dagger-inputs ]] || { echo ".dagger-inputs must be a real directory" >&2; exit 1; }
          else
            mkdir -m 700 .dagger-inputs
          fi
          [[ ! -L .dagger-inputs/base-openapi.yaml && ( ! -e .dagger-inputs/base-openapi.yaml || -f .dagger-inputs/base-openapi.yaml ) ]] || { echo "OpenAPI baseline input must be a regular file" >&2; exit 1; }
          DAGGER_HAS_BASELINE=false
          : > .dagger-inputs/base-openapi.yaml
          if [[ "$DAGGER_EVENT_NAME" == pull_request ]]; then
            [[ "$BASE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "Invalid pull request base ref" >&2; exit 1; }
            if git show "origin/${BASE_REF}:api/openapi.yaml" > .dagger-inputs/base-openapi.yaml 2>/dev/null; then
              DAGGER_HAS_BASELINE=true
            else
              echo "No API compatibility baseline exists."
            fi
          fi
          export DAGGER_HAS_BASELINE
          bash scripts/materialize-dagger-input.sh ci .dagger-inputs/root.json

      - name: Install exact Dagger CLI on GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.8"

      - name: Require exact Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 { print $2 }')" = v0.21.8

      - name: Root Dagger gates
        shell: bash
        run: dagger call root-ci --source=. --input=.dagger-inputs/root.json --baseline=.dagger-inputs/base-openapi.yaml

  agent:
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-latest'
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Materialize agent Dagger input
        shell: bash
        env:
          DAGGER_EVENT_NAME: ${{ github.event_name }}
          DAGGER_REF: ${{ github.ref }}
          DAGGER_RUN_ID: ${{ github.run_id }}
          DAGGER_RUN_ATTEMPT: ${{ github.run_attempt }}
          DAGGER_HAS_BASELINE: "false"
        run: bash scripts/materialize-dagger-input.sh ci .dagger-inputs/agent.json

      - name: Install exact Dagger CLI on GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.8"

      - name: Require exact Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 { print $2 }')" = v0.21.8

      - name: Agent Dagger gates
        shell: bash
        run: dagger call agent-ci --source=. --input=.dagger-inputs/agent.json

  agent-workspace:
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.actor &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON(vars.HOSTINGER_PR_ACTORS_JSON || '[]'), github.actor) &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-pr"]') ||
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        fromJSON('["self-hosted","Linux","X64","hostinger-vps-trusted"]') ||
        'ubuntu-latest'
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Materialize workspace Dagger input
        shell: bash
        env:
          DAGGER_EVENT_NAME: ${{ github.event_name }}
          DAGGER_REF: ${{ github.ref }}
          DAGGER_RUN_ID: ${{ github.run_id }}
          DAGGER_RUN_ATTEMPT: ${{ github.run_attempt }}
          DAGGER_HAS_BASELINE: "false"
        run: bash scripts/materialize-dagger-input.sh ci .dagger-inputs/agent-workspace.json

      - name: Install exact Dagger CLI on GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b # v8.3.0
        with:
          version: "0.21.8"

      - name: Require exact Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(dagger version | awk 'NR == 1 { print $2 }')" = v0.21.8

      - name: Agent workspace Dagger gate
        shell: bash
        run: dagger call agent-workspace-ci --source=. --input=.dagger-inputs/agent-workspace.json
