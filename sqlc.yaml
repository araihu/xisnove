version: "2"
sql:
  - engine: sqlite
    schema: db/migrations/sqlite
    queries: db/queries/sqlite
    gen:
      go:
        package: dbsqlite
        out: db/generated/sqlite
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
  - engine: postgresql
    schema: db/migrations/postgres
    queries: db/queries/postgres
    gen:
      go:
        package: dbpostgres
        out: db/generated/postgres
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
