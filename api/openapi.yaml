openapi: 3.1.2
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Xisnove API
  version: 0.4.0
  description: API for the Xisnove monitoring control plane and outbound agents.
servers:
  - url: /
security:
  - adminBearer: []
tags:
  - name: auth
  - name: management
  - name: agent
  - name: incidents
  - name: discovery
  - name: notifications
  - name: maintenance
  - name: public-status
paths:
  /v1/sessions:
    post:
      operationId: createSession
      tags: [auth]
      security: []
      x-xisnove-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSessionRequest'}
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/sessions/current:
    delete:
      operationId: revokeCurrentSession
      summary: Revoke the credential used for this request
      tags: [auth]
      security: [{adminBearer: []}]
      x-xisnove-scopes: [tokens:write]
      responses:
        '204': {description: Session revoked}
        default: {$ref: '#/components/responses/Problem'}
  /v1/api-tokens:
    post:
      operationId: createAPIToken
      summary: Create a scoped API token
      tags: [auth]
      security: [{adminBearer: []}]
      x-xisnove-scopes: [tokens:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAPITokenRequest'}
      responses:
        '201':
          description: API token created; the credential is returned only once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedAPIToken'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: listAPITokens
      summary: List redacted API tokens
      tags: [auth]
      security: [{adminBearer: []}]
      x-xisnove-scopes: [tokens:read]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Bounded API token page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APITokenPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/api-tokens/{tokenId}:
    parameters:
      - {$ref: '#/components/parameters/APITokenID'}
    get:
      operationId: getAPIToken
      summary: Get a redacted API token
      tags: [auth]
      security: [{adminBearer: []}]
      x-xisnove-scopes: [tokens:read]
      responses:
        '200':
          description: Redacted API token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIToken'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateAPIToken
      summary: Update API token metadata and scopes
      tags: [auth]
      security: [{adminBearer: []}]
      x-xisnove-scopes: [tokens:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAPITokenRequest'}
      responses:
        '200':
          description: Redacted updated API token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIToken'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: revokeAPIToken
      summary: Revoke an API token
      tags: [auth]
      security: [{adminBearer: []}]
      x-xisnove-scopes: [tokens:write]
      responses:
        '204': {description: API token revoked}
        default: {$ref: '#/components/responses/Problem'}
  /v1/locations:
    post:
      operationId: createLocation
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [locations:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateLocationRequest'}
      responses:
        '201':
          description: Location created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Location'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: listLocations
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [locations:read]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Bounded location page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocationPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/locations/{locationId}:
    parameters:
      - {$ref: '#/components/parameters/LocationID'}
    get:
      operationId: getLocation
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [locations:read]
      responses:
        '200':
          description: Location
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Location'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateLocation
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [locations:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateLocationRequest'}
      responses:
        '200':
          description: Updated location
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Location'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: disableLocation
      summary: Disable a location without deleting history
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [locations:write]
      responses:
        '204': {description: Location disabled}
        default: {$ref: '#/components/responses/Problem'}
  /v1/monitors:
    post:
      operationId: createMonitor
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [monitors:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMonitorRequest'}
      responses:
        '201':
          description: Monitor created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Monitor'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: listMonitors
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [monitors:read]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Bounded monitor page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonitorPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/monitors/{monitorId}:
    parameters:
      - {$ref: '#/components/parameters/MonitorID'}
    get:
      operationId: getMonitor
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [monitors:read]
      responses:
        '200':
          description: Monitor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Monitor'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateMonitor
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [monitors:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMonitorRequest'}
      responses:
        '200':
          description: Updated monitor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Monitor'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: disableMonitor
      summary: Disable a monitor without deleting history
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [monitors:write]
      responses:
        '204': {description: Monitor disabled}
        default: {$ref: '#/components/responses/Problem'}
  /v1/agent-enrollment-tokens:
    post:
      operationId: createAgentEnrollmentToken
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [agents:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentEnrollmentTokenRequest'}
      responses:
        '201':
          description: One-time token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentEnrollmentToken'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/agent-enrollments:
    post:
      operationId: enrollAgent
      tags: [agent]
      security: []
      x-xisnove-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollAgentRequest'}
      responses:
        '201':
          description: Agent credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrolledAgent'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/agent/heartbeat:
    post:
      operationId: heartbeatAgent
      tags: [agent]
      security: [{agentBearer: []}]
      x-xisnove-scopes: [agent:heartbeat]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentHeartbeat'}
      responses:
        '204': {description: Heartbeat accepted}
        default: {$ref: '#/components/responses/Problem'}
  /v1/agent/work:lease:
    post:
      operationId: leaseAgentWork
      tags: [agent]
      security: [{agentBearer: []}]
      x-xisnove-scopes: [agent:work]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LeaseWorkRequest'}
      responses:
        '200':
          description: Leased protocol-neutral probe work
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProbeWork'}
        '204': {description: No compatible work before timeout}
        default: {$ref: '#/components/responses/Problem'}
  /v1/agent/results:batch:
    post:
      operationId: uploadProbeResults
      tags: [agent]
      security: [{agentBearer: []}]
      x-xisnove-scopes: [agent:results]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProbeResultBatch'}
      responses:
        '200':
          description: Per-result acknowledgements
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProbeResultBatchAcknowledgement'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/monitors/{monitorId}/health:
    parameters:
      - {$ref: '#/components/parameters/MonitorID'}
    get:
      operationId: getMonitorHealth
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [monitors:read]
      responses:
        '200':
          description: Monitor health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonitorHealth'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/monitors/{monitorId}/active-incident:
    parameters:
      - {$ref: '#/components/parameters/MonitorID'}
    get:
      operationId: getActiveMonitorIncident
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [incidents:read]
      responses:
        '200':
          description: Active Incident
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}
        '204': {description: No active Incident}
        default: {$ref: '#/components/responses/Problem'}
  /v1/agents:
    get:
      operationId: listAgents
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [agents:read]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Bounded agent page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/agents/{agentId}:
    parameters:
      - {$ref: '#/components/parameters/AgentID'}
    get:
      operationId: getAgent
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [agents:read]
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateAgent
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [agents:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAgentRequest'}
      responses:
        '200':
          description: Updated agent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: revokeAgent
      summary: Revoke an agent credential and disable the agent
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [agents:write]
      responses:
        '204': {description: Agent disabled}
        default: {$ref: '#/components/responses/Problem'}
  /v1/agents/{agentId}/credential-rotations:
    parameters:
      - {$ref: '#/components/parameters/AgentID'}
    post:
      operationId: rotateAgentCredential
      summary: Revoke the current Agent credential and issue its replacement once
      tags: [management]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [agents:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '201':
          description: Replacement Agent credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCredential'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [incidents:read]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: state
          in: query
          schema: {type: string, enum: [open, resolved]}
      responses:
        '200':
          description: Bounded incident page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncidentPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/incidents/{incidentId}:
    parameters:
      - {$ref: '#/components/parameters/IncidentID'}
    get:
      operationId: getIncident
      tags: [incidents]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [incidents:read]
      responses:
        '200':
          description: Incident
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Incident'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/incidents/{incidentId}/events:
    parameters:
      - {$ref: '#/components/parameters/IncidentID'}
    get:
      operationId: listIncidentEvents
      tags: [incidents]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [incidents:read]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Bounded incident event page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IncidentEventPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/agent/discovery-candidates:batch:
    post:
      operationId: upsertDiscoveryCandidates
      summary: Idempotently upsert a bounded discovery candidate batch
      tags: [agent, discovery]
      security: [{agentBearer: []}]
      x-xisnove-scopes: [agent:discovery]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DiscoveryCandidateBatch'}
      responses:
        '200':
          description: Discovery candidates accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiscoveryCandidateBatchAcknowledgement'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/discovery-candidates:
    get:
      operationId: listDiscoveryCandidates
      tags: [discovery]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [discovery:read]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: state
          in: query
          schema: {$ref: '#/components/schemas/DiscoveryCandidateState'}
      responses:
        '200':
          description: Bounded discovery candidate catalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiscoveryCandidatePage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/discovery-candidates/{candidateId}:
    parameters:
      - {$ref: '#/components/parameters/DiscoveryCandidateID'}
    get:
      operationId: getDiscoveryCandidate
      tags: [discovery]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [discovery:read]
      responses:
        '200':
          description: Discovery candidate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiscoveryCandidate'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/discovery-candidates/{candidateId}/promotion:
    parameters:
      - {$ref: '#/components/parameters/DiscoveryCandidateID'}
    post:
      operationId: promoteDiscoveryCandidate
      summary: Explicitly promote one discovery candidate to a monitor
      tags: [discovery]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [discovery:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromotionRequest'}
      responses:
        '201':
          description: Discovery candidate promoted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiscoveryPromotion'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/notification-channels:
    post:
      operationId: createNotificationChannel
      summary: Create an encrypted notification channel
      tags: [notifications]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [notifications:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        description: Channel configuration is accepted only on writes and never reflected.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateNotificationChannelRequest'}
      responses:
        '201':
          description: Notification channel created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannel'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: listNotificationChannels
      summary: List redacted notification channels
      tags: [notifications]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [notifications:read]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Bounded notification channel page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannelPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/notification-channels/{channelId}:
    parameters:
      - {$ref: '#/components/parameters/NotificationChannelID'}
    get:
      operationId: getNotificationChannel
      summary: Get a redacted notification channel
      tags: [notifications]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [notifications:read]
      responses:
        '200':
          description: Redacted notification channel
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannel'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateNotificationChannel
      summary: Replace notification channel configuration
      tags: [notifications]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [notifications:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        description: Replacement configuration is write-only.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateNotificationChannelRequest'}
      responses:
        '200':
          description: Notification channel updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannel'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: disableNotificationChannel
      summary: Disable a notification channel without deleting history
      tags: [notifications]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [notifications:write]
      responses:
        '204': {description: Notification channel disabled}
        default: {$ref: '#/components/responses/Problem'}
  /v1/notification-routes:
    post:
      operationId: createNotificationRoute
      summary: Create a typed incident notification route
      tags: [notifications]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [notifications:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        description: Route matchers and immutable render template.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationRouteInput'}
      responses:
        '201':
          description: Notification route created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationRoute'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: listNotificationRoutes
      summary: List notification routes
      tags: [notifications]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [notifications:read]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Bounded notification route page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationRoutePage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/notification-routes/{routeId}:
    parameters:
      - {$ref: '#/components/parameters/NotificationRouteID'}
    get:
      operationId: getNotificationRoute
      summary: Get a notification route
      tags: [notifications]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [notifications:read]
      responses:
        '200':
          description: Notification route
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationRoute'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateNotificationRoute
      summary: Replace a notification route
      tags: [notifications]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [notifications:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        description: Complete typed route replacement.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationRouteInput'}
      responses:
        '200':
          description: Notification route updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationRoute'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: disableNotificationRoute
      summary: Disable a notification route without deleting history
      tags: [notifications]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [notifications:write]
      responses:
        '204': {description: Notification route disabled}
        default: {$ref: '#/components/responses/Problem'}
  /v1/notification-deliveries:
    get:
      operationId: listNotificationDeliveries
      summary: List durable notification delivery state
      tags: [notifications]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [notifications:read]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Bounded notification delivery page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationDeliveryPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/notification-deliveries/{deliveryId}:
    parameters:
      - {$ref: '#/components/parameters/NotificationDeliveryID'}
    get:
      operationId: getNotificationDelivery
      summary: Get delivery state and bounded attempts
      tags: [notifications]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [notifications:read]
      responses:
        '200':
          description: Notification delivery
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationDeliveryDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/notification-deliveries/{deliveryId}/replay:
    parameters:
      - {$ref: '#/components/parameters/NotificationDeliveryID'}
    post:
      operationId: replayNotificationDelivery
      summary: Explicitly replay a permanently failed delivery
      tags: [notifications]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [notifications:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {description: Notification delivery queued for replay}
        default: {$ref: '#/components/responses/Problem'}
  /v1/maintenance:
    post:
      operationId: createMaintenance
      summary: Create one-off or indefinite maintenance
      tags: [maintenance]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [maintenance:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        description: Maintenance interval for one monitor.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMaintenanceRequest'}
      responses:
        '201':
          description: Maintenance created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Maintenance'}
        default: {$ref: '#/components/responses/Problem'}
    get:
      operationId: listMaintenance
      summary: List maintenance intervals
      tags: [maintenance]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [maintenance:read]
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Bounded maintenance page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenancePage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/maintenance/{maintenanceId}:
    parameters:
      - {$ref: '#/components/parameters/MaintenanceID'}
    get:
      operationId: getMaintenance
      summary: Get a maintenance interval
      tags: [maintenance]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [maintenance:read]
      responses:
        '200':
          description: Maintenance interval
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Maintenance'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteMaintenance
      summary: Delete maintenance that has not started
      tags: [maintenance]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [maintenance:write]
      responses:
        '204': {description: Future maintenance deleted}
        default: {$ref: '#/components/responses/Problem'}
  /v1/maintenance/{maintenanceId}/end:
    parameters:
      - {$ref: '#/components/parameters/MaintenanceID'}
    post:
      operationId: endMaintenance
      summary: End active or indefinite maintenance now
      tags: [maintenance]
      security: [{adminBearer: []}, {apiTokenBearer: []}]
      x-xisnove-scopes: [maintenance:write]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: Maintenance ended
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Maintenance'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/status-page:
    get:
      operationId: getPublicStatusPage
      summary: Get the single aggregate public status page
      tags: [public-status]
      security: []
      x-xisnove-scopes: []
      responses:
        '200':
          description: Aggregate status for explicitly public monitors
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicStatusPage'}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: Revocable administrator session credential.
      x-xisnove-scopes:
        - tokens:read
        - tokens:write
        - locations:read
        - locations:write
        - monitors:read
        - monitors:write
        - agents:read
        - agents:write
        - incidents:read
        - notifications:read
        - notifications:write
        - maintenance:read
        - maintenance:write
        - discovery:read
        - discovery:write
        - status:read
    apiTokenBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-api-token
      description: Revocable API token constrained to its stored scopes.
      x-xisnove-scopes:
        - tokens:read
        - tokens:write
        - locations:read
        - locations:write
        - monitors:read
        - monitors:write
        - agents:read
        - agents:write
        - incidents:read
        - notifications:read
        - notifications:write
        - maintenance:read
        - maintenance:write
        - discovery:read
        - discovery:write
        - status:read
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-agent
      description: Revocable per-agent credential.
      x-xisnove-scopes:
        - agent:heartbeat
        - agent:work
        - agent:results
        - agent:discovery
  parameters:
    APITokenID:
      name: tokenId
      in: path
      required: true
      schema: {type: string, format: uuid}
    LocationID:
      name: locationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MonitorID:
      name: monitorId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AgentID:
      name: agentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IncidentID:
      name: incidentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DiscoveryCandidateID:
      name: candidateId
      in: path
      required: true
      schema: {type: string, format: uuid}
    NotificationChannelID:
      name: channelId
      in: path
      required: true
      description: Notification channel identifier.
      schema: {type: string, format: uuid}
    NotificationRouteID:
      name: routeId
      in: path
      required: true
      description: Notification route identifier.
      schema: {type: string, format: uuid}
    NotificationDeliveryID:
      name: deliveryId
      in: path
      required: true
      description: Notification delivery identifier.
      schema: {type: string, format: uuid}
    MaintenanceID:
      name: maintenanceId
      in: path
      required: true
      description: Maintenance interval identifier.
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      description: Maximum number of records to return.
      schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 50}
    Cursor:
      name: cursor
      in: query
      description: Opaque continuation token returned as page.nextCursor by a previous page.
      schema: {type: string, minLength: 1, maxLength: 1024}
    Offset:
      name: offset
      in: query
      description: Deprecated compatibility offset; new clients use cursor.
      deprecated: true
      schema: {type: integer, format: int32, minimum: 0, maximum: 1000000, default: 0}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Caller-generated key that makes a retry return the original mutation result.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: '^[A-Za-z0-9._~:+/-]+$'
  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 8, maxLength: 1024, writeOnly: true}
    Session:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token: {type: string, minLength: 32}
        expiresAt: {type: string, format: date-time}
    APITokenScope:
      type: string
      enum:
        - tokens:read
        - tokens:write
        - locations:read
        - locations:write
        - monitors:read
        - monitors:write
        - agents:read
        - agents:write
        - incidents:read
        - notifications:read
        - notifications:write
        - maintenance:read
        - maintenance:write
        - discovery:read
        - discovery:write
        - status:read
    CreateAPITokenRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: {$ref: '#/components/schemas/APITokenScope'}
        expiresAt: {type: string, format: date-time}
    UpdateAPITokenRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: {$ref: '#/components/schemas/APITokenScope'}
        expiresAt: {type: string, format: date-time}
    APIToken:
      type: object
      additionalProperties: false
      required: [id, name, scopes, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: {$ref: '#/components/schemas/APITokenScope'}
        expiresAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreatedAPIToken:
      type: object
      additionalProperties: false
      required: [apiToken, token]
      properties:
        apiToken: {$ref: '#/components/schemas/APIToken'}
        token:
          type: string
          minLength: 32
          description: One-time plaintext credential; it is never returned again.
    PageMetadata:
      type: object
      additionalProperties: false
      properties:
        nextCursor: {type: string, minLength: 1, maxLength: 1024}
    APITokenPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/APIToken'}
        page: {$ref: '#/components/schemas/PageMetadata'}
    CreateLocationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
    Location:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UpdateLocationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        enabled: {type: boolean}
    LocationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Location'}
        page: {$ref: '#/components/schemas/PageMetadata'}
    CreateMonitorRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - intervalSeconds
        - timeoutMillis
        - failureThreshold
        - recoveryThreshold
        - locationId
        - requiredLocation
        - probe
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2048, default: ''}
        labels:
          type: object
          maxProperties: 64
          default: {}
          additionalProperties: {type: string, maxLength: 253}
        displayOrder: {type: integer, format: int32, minimum: 0, default: 0}
        public: {type: boolean, default: false}
        intervalSeconds: {type: integer, format: int32, minimum: 5, maximum: 86400}
        timeoutMillis: {type: integer, format: int32, minimum: 100, maximum: 120000}
        failureThreshold: {type: integer, format: int32, minimum: 1, maximum: 100}
        recoveryThreshold: {type: integer, format: int32, minimum: 1, maximum: 100}
        locationId: {type: string, format: uuid}
        requiredLocation: {type: boolean}
        probe: {$ref: '#/components/schemas/ProbeDefinition'}
    UpdateMonitorRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2048}
        labels:
          type: object
          maxProperties: 64
          additionalProperties: {type: string, maxLength: 253}
        displayOrder: {type: integer, format: int32, minimum: 0}
        public: {type: boolean}
        enabled: {type: boolean}
        intervalSeconds: {type: integer, format: int32, minimum: 5, maximum: 86400}
        timeoutMillis: {type: integer, format: int32, minimum: 100, maximum: 120000}
        failureThreshold: {type: integer, format: int32, minimum: 1, maximum: 100}
        recoveryThreshold: {type: integer, format: int32, minimum: 1, maximum: 100}
        locationId: {type: string, format: uuid}
        requiredLocation: {type: boolean}
        probe: {$ref: '#/components/schemas/ProbeDefinition'}
    ProbeDefinition:
      oneOf:
        - {$ref: '#/components/schemas/HTTPProbeDefinition'}
        - {$ref: '#/components/schemas/TCPProbeDefinition'}
        - {$ref: '#/components/schemas/DNSProbeDefinition'}
      discriminator:
        propertyName: kind
        mapping:
          http: '#/components/schemas/HTTPProbeDefinition'
          tcp: '#/components/schemas/TCPProbeDefinition'
          dns: '#/components/schemas/DNSProbeDefinition'
    HTTPProbeDefinition:
      type: object
      additionalProperties: false
      required:
        - kind
        - method
        - url
        - headers
        - body
        - expectedStatus
        - bodyContains
        - bodyDoesNotContain
        - followRedirects
      properties:
        kind: {type: string, enum: [http]}
        method:
          type: string
          enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
        url: {type: string, format: uri, maxLength: 4096}
        headers:
          type: object
          maxProperties: 100
          additionalProperties: {type: string, maxLength: 4096}
        body: {type: string, format: byte, maxLength: 5464}
        expectedStatus:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/StatusRange'}
        bodyContains:
          type: array
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 4096}
        bodyDoesNotContain:
          type: array
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 4096}
        followRedirects: {type: boolean}
        tlsMinimumRemainingSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 31536000
    TCPProbeDefinition:
      type: object
      additionalProperties: false
      required: [kind, host, port, send, expect]
      properties:
        kind: {type: string, enum: [tcp]}
        host: {type: string, minLength: 1, maxLength: 253}
        port: {type: integer, format: int32, minimum: 1, maximum: 65535}
        send: {type: string, format: byte, maxLength: 5464}
        expect: {type: string, format: byte, maxLength: 5464}
        tlsMinimumRemainingSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 31536000
    DNSProbeDefinition:
      type: object
      additionalProperties: false
      required: [kind, resolver, name, recordType, expectedValues]
      properties:
        kind: {type: string, enum: [dns]}
        resolver: {type: string, maxLength: 261}
        name: {type: string, minLength: 1, maxLength: 253}
        recordType: {type: string, enum: [A, AAAA, CNAME, MX, NS, TXT, SRV]}
        expectedValues:
          type: array
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 4096}
    StatusRange:
      type: object
      additionalProperties: false
      required: [minimum, maximum]
      properties:
        minimum: {type: integer, format: int32, minimum: 100, maximum: 599}
        maximum: {type: integer, format: int32, minimum: 100, maximum: 599}
    Monitor:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - name
        - description
        - labels
        - displayOrder
        - public
        - enabled
        - intervalSeconds
        - timeoutMillis
        - failureThreshold
        - recoveryThreshold
        - locationId
        - requiredLocation
        - probe
        - createdAt
        - updatedAt
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [http, tcp, dns]}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2048}
        labels:
          type: object
          maxProperties: 64
          additionalProperties: {type: string, maxLength: 253}
        displayOrder: {type: integer, format: int32, minimum: 0}
        public: {type: boolean}
        enabled: {type: boolean}
        intervalSeconds: {type: integer, format: int32, minimum: 5, maximum: 86400}
        timeoutMillis: {type: integer, format: int32, minimum: 100, maximum: 120000}
        failureThreshold: {type: integer, format: int32, minimum: 1, maximum: 100}
        recoveryThreshold: {type: integer, format: int32, minimum: 1, maximum: 100}
        locationId: {type: string, format: uuid}
        requiredLocation: {type: boolean}
        probe: {$ref: '#/components/schemas/ProbeDefinition'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    MonitorPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Monitor'}
        page: {$ref: '#/components/schemas/PageMetadata'}
    CreateAgentEnrollmentTokenRequest:
      type: object
      additionalProperties: false
      required: [locationId, expiresInSeconds]
      properties:
        locationId: {type: string, format: uuid}
        expiresInSeconds: {type: integer, format: int32, minimum: 60, maximum: 86400}
    AgentEnrollmentToken:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token: {type: string, minLength: 32}
        expiresAt: {type: string, format: date-time}
    EnrollAgentRequest:
      type: object
      additionalProperties: false
      required: [token, name, capabilities]
      properties:
        token: {type: string, minLength: 32, writeOnly: true}
        name: {type: string, minLength: 1, maxLength: 120}
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/AgentCapability'}
    EnrolledAgent:
      type: object
      additionalProperties: false
      required: [agentId, credential, credentialGeneration]
      properties:
        agentId: {type: string, format: uuid}
        credential: {type: string, minLength: 32}
        credentialGeneration: {type: integer, format: int64, minimum: 1}
    AgentCredential:
      type: object
      additionalProperties: false
      required: [agentId, credential, credentialGeneration]
      properties:
        agentId: {type: string, format: uuid}
        credential: {type: string, minLength: 32, writeOnly: true}
        credentialGeneration: {type: integer, format: int64, minimum: 1}
    Agent:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - locationId
        - enabled
        - credentialGeneration
        - capabilities
        - createdAt
        - updatedAt
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        locationId: {type: string, format: uuid}
        enabled: {type: boolean}
        credentialGeneration: {type: integer, format: int64, minimum: 1}
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/AgentCapability'}
        version: {type: string, minLength: 1, maxLength: 64}
        lastSeenAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UpdateAgentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        enabled: {type: boolean}
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/AgentCapability'}
    AgentPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Agent'}
        page: {$ref: '#/components/schemas/PageMetadata'}
    AgentHeartbeat:
      type: object
      additionalProperties: false
      required: [version, credentialGeneration, capabilities]
      properties:
        version: {type: string, minLength: 1, maxLength: 64}
        credentialGeneration: {type: integer, format: int64, minimum: 1}
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/AgentCapability'}
    LeaseWorkRequest:
      type: object
      additionalProperties: false
      required: [waitSeconds, capabilities]
      properties:
        waitSeconds: {type: integer, format: int32, minimum: 0, maximum: 30}
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/AgentCapability'}
    ProbeWork:
      type: object
      additionalProperties: false
      required: [runId, leaseToken, monitorId, scheduledFor, timeoutMillis, probe]
      properties:
        runId: {type: string, format: uuid}
        leaseToken: {type: string, minLength: 32}
        monitorId: {type: string, format: uuid}
        scheduledFor: {type: string, format: date-time}
        timeoutMillis: {type: integer, format: int32, minimum: 100, maximum: 120000}
        probe: {$ref: '#/components/schemas/ProbeDefinition'}
    ProbeResultBatch:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/ProbeResultInput'}
    ProbeResultInput:
      type: object
      additionalProperties: false
      required:
        - resultId
        - runId
        - leaseToken
        - startedAt
        - finishedAt
        - outcome
        - latencyMillis
        - observedStatus
        - bodyAssertionPassed
        - errorCode
        - diagnosticSample
      properties:
        resultId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        leaseToken: {type: string, minLength: 32}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        outcome: {type: string, enum: [passed, failed]}
        latencyMillis: {type: integer, format: int64, minimum: 0}
        observedStatus: {type: integer, format: int32, minimum: 0, maximum: 599}
        bodyAssertionPassed: {type: boolean}
        errorCode:
          type: string
          enum:
            - ''
            - timeout
            - dns_error
            - connect_error
            - tls_error
            - protocol_error
            - status_mismatch
            - body_mismatch
            - dns_mismatch
            - tcp_expect_mismatch
            - tls_expiring
            - target_denied
            - response_too_large
        diagnosticSample: {type: string, maxLength: 512}
        observedValues:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 4096}
        tlsNotAfter: {type: string, format: date-time}
        protocolTimings: {$ref: '#/components/schemas/ProtocolTimings'}
