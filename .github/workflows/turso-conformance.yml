name: managed Turso conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
  release:
    types: [published, prereleased]

permissions:
  contents: read

concurrency:
  group: managed-turso-conformance
  cancel-in-progress: false

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.1"
          cache-dependency-path: go.sum
      - name: Run managed Turso persistence conformance
        env:
          TURSO_API_KEY: ${{ secrets.TURSO_API_KEY }}
          TURSO_ORG: ${{ vars.TURSO_ORG }}
          TURSO_GROUP: ${{ vars.TURSO_GROUP }}
        run: go test -race ./internal/adapters/tursocloud -run Conformance -count=1
