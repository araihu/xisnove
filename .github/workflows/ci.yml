name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  root:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine3.23
        env:
          POSTGRES_DB: xisnove
          POSTGRES_PASSWORD: xisnove
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xisnove"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            go.sum
            agent/go.sum
      - run: go tool vacuum lint -d api/openapi.yaml
      - run: go generate ./...
      - run: go tool sqlc generate
      - run: go tool sqlc diff
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
        env:
          XISNOVE_TEST_POSTGRES_URL: postgres://postgres:xisnove@127.0.0.1:5432/xisnove?sslmode=disable
      - name: Verify identical storage journey across local profiles
        env:
          XISNOVE_TEST_POSTGRES_URL: postgres://postgres:xisnove@127.0.0.1:5432/xisnove?sslmode=disable
        run: go test -race ./integration -run TestStorageMatrix -count=1
      - name: PostgreSQL backup and restore smoke
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: xisnove
          POSTGRES_DATABASE: xisnove
          POSTGRES_RESTORE_DATABASE: xisnove_restore_smoke
          XISNOVE_TEST_POSTGRES_URL: postgres://postgres:xisnove@127.0.0.1:5432/xisnove?sslmode=disable
          XISNOVE_TEST_POSTGRES_RESTORE_URL: postgres://postgres:xisnove@127.0.0.1:5432/xisnove_restore_smoke?sslmode=disable
        run: bash scripts/postgres-backup-smoke.sh
      - name: Check OpenAPI compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git show "origin/${BASE_REF}:api/openapi.yaml" > /tmp/base-openapi.yaml 2>/dev/null; then
            go tool oasdiff breaking /tmp/base-openapi.yaml api/openapi.yaml
          else
            echo "No API compatibility baseline exists."
          fi

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.1"
          cache-dependency-path: agent/go.sum
      - run: GOWORK=off go generate ./...
      - run: git diff --exit-code
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off go test -race ./...

  agent-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            go.sum
            agent/go.sum
      - run: go test -race ./agent/...
